# Living-room tick: one unprompted turn every 20 minutes (Phase 10).
# Centralized generation — visitors only read. Groq free tier, lean Low
# prompt (~2k input tokens, far inside the 7k wall), plain prose out.
# Needs repo secret GROQ_API_KEY (server-side only, never in code).
# Missed ticks stay missed: schedule misses never backfill in bursts.
name: room-tick

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      seat:
        description: 'First speaker (e.g. genzie). Blank = roster order; rest follow the roster.'
        required: false
        default: ''
      turns:
        description: 'Turns to write this run (1–5). A run plays one scene: each turn sees the one before.'
        required: false
        default: '1'

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: One room turn
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          args=""
          if [ -n "${{ inputs.seat }}" ]; then args="$args --seat ${{ inputs.seat }}"; fi
          if [ -n "${{ inputs.turns }}" ] && [ "${{ inputs.turns }}" != "1" ]; then args="$args --turns ${{ inputs.turns }}"; fi
          # shellcheck disable=SC2086
          node scripts/room-tick.mjs $args
      - name: Commit transcript
        run: |
          git config user.name "cabinet-room"
          git config user.email "cabinet-room@users.noreply.github.com"
          git add public/room/transcript.json
          git diff --cached --quiet && echo "no turn appended" || git commit -m "Room tick" && git push
