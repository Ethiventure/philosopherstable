# Netlify: static publish + one serverless function (the shared-LLM proxy).
# The Groq key lives ONLY in the Netlify dashboard (Site settings → Environment
# variables → GROQ_API_KEY). It is never in this repo and never in the bundle.
[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"
  # Second lock (Oct 27 2026): room ticks carry [skip ci], but a tick
  # commit that ever forgets its tag still costs zero build minutes.
  # Builds run only when something outside the room data/docs changes.
  ignore = "git diff --quiet HEAD^ HEAD -- . ':!public/room' ':!docs' ':!graphify-out'"

# SPA fallback — must come after any function/API routes (functions take precedence).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
